name: Build & Preview Watch Faces

# Path-filtered: only the watch face module(s) whose files actually changed
# get built and previewed. To add a new watch face:
#   1. Add a filter entry below (module-name: [module-name/**]).
#   2. Copy the build-<name>/preview-<name> job pair and swap the module name.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      moonswatch-snoopy: ${{ steps.filter.outputs.moonswatch-snoopy }}
      moonswatch-snoopy2: ${{ steps.filter.outputs.moonswatch-snoopy2 }}
      rolex-deepsea: ${{ steps.filter.outputs.rolex-deepsea }}
      rolex-deepsea2: ${{ steps.filter.outputs.rolex-deepsea2 }}
      lollipop: ${{ steps.filter.outputs.lollipop }}
      breguet: ${{ steps.filter.outputs.breguet }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            moonswatch-snoopy:
              - 'moonswatch-snoopy/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            moonswatch-snoopy2:
              - 'moonswatch-snoopy2/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            rolex-deepsea:
              - 'rolex-deepsea/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            rolex-deepsea2:
              - 'rolex-deepsea2/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            lollipop:
              - 'lollipop/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            breguet:
              - 'breguet/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'

  build-breguet:
    needs: changes
    if: needs.changes.outputs.breguet == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :breguet:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: breguet-APK
          path: breguet/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-lollipop:
    needs: changes
    if: needs.changes.outputs.lollipop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :lollipop:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: lollipop-APK
          path: lollipop/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-rolex-deepsea2:
    needs: changes
    if: needs.changes.outputs.rolex-deepsea2 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :rolex-deepsea2:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: rolex-deepsea2-APK
          path: rolex-deepsea2/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-rolex-deepsea:
    needs: changes
    if: needs.changes.outputs.rolex-deepsea == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :rolex-deepsea:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: rolex-deepsea-APK
          path: rolex-deepsea/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-moonswatch-snoopy2:
    needs: changes
    if: needs.changes.outputs.moonswatch-snoopy2 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :moonswatch-snoopy2:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: moonswatch-snoopy2-APK
          path: moonswatch-snoopy2/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-moonswatch-snoopy:
    needs: changes
    if: needs.changes.outputs.moonswatch-snoopy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :moonswatch-snoopy:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: moonswatch-snoopy-APK
          path: moonswatch-snoopy/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  preview-moonswatch-snoopy:
    needs: [changes, build-moonswatch-snoopy]
    if: needs.changes.outputs.moonswatch-snoopy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :moonswatch-snoopy:assembleDebug

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture moon-phase sweep and AOD screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          avd-name: MoonswatchSnoopyPreview
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: chmod +x moonswatch-snoopy/preview.sh .github/scripts/install_and_activate.sh && bash moonswatch-snoopy/preview.sh

      - name: Write preview summary
        if: always()
        run: |
          {
            echo "## moonswatch-snoopy: moon-phase sweep (+0/5/10/15/20/25 days) and AOD preview"
            echo
            for f in previews/moon_*.png previews/aod_screen.png; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              echo "**${name}**"
              echo
              echo "![${name}](data:image/png;base64,$(base64 -w0 "$f"))"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonswatch-snoopy-previews
          path: previews/*.png
          if-no-files-found: warn

      - name: Publish previews into the repo for one-tap viewing
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(previews/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No preview images were produced, skipping publish."
            exit 0
          fi
          mkdir -p docs/previews/moonswatch-snoopy
          rm -f docs/previews/moonswatch-snoopy/*.png
          cp previews/*.png docs/previews/moonswatch-snoopy/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/previews/moonswatch-snoopy
          if git diff --cached --quiet; then
            echo "Previews unchanged, nothing to commit."
          else
            git commit -m "Update moonswatch-snoopy AOD/moon-phase previews [skip ci]"
            # Publish back to whichever branch triggered this run, not a
            # hard-coded "main" — rebasing onto main here previously blew up
            # with add/add conflicts on every file that differs between a
            # long-lived feature branch and main, even though this commit
            # only touches the preview PNGs.
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
