name: Build & Preview Watch Faces

# Two ways this runs, kept deliberately separate so a manual build of one
# watch face never costs Actions minutes on the other watch faces:
#   - push to main: path-filtered via dorny/paths-filter (clean before/after
#     diff on a push, so this is reliable) -- only the watch face(s) whose
#     files actually changed get built.
#   - workflow_dispatch: the person triggering picks exactly one watch face
#     (or "all") from the dropdown below. This skips path-diffing entirely,
#     which matters because diffing "branch vs main" is NOT reliable for a
#     long-lived feature branch -- once any file under a watch face's path
#     has ever differed from main on that branch, the diff-based filter
#     stays "changed" for that face on every subsequent manual run for the
#     rest of the branch's life, silently rebuilding faces nobody touched.
#
# To add a new watch face:
#   1. Add a filter entry below (module-name: [module-name/**]).
#   2. Add its name to the workflow_dispatch "watchface" input's options.
#   3. Copy a build-<name>/preview-<name> job pair, swap the module name, and
#      give it the same two-branch `if:` (push-path-filter OR dispatch-pick).
on:
  workflow_dispatch:
    inputs:
      watchface:
        description: "Which watch face to build (or 'all')"
        required: true
        type: choice
        options:
          - moonswatch-snoopy
          - moonswatch-snoopy2
          - rolex-deepsea
          - rolex-deepsea2
          - lollipop
          - breguet
          - hublot-balloondog
          - lucea
          - chanel-j12
          - chanel-j12-2
          - snoopy1-moonswatch
          - snoopy2-earth
          - snoopy3-earth-subdial
          - rolex-datejust
          - all
  push:
    branches: [main]

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      moonswatch-snoopy: ${{ steps.filter.outputs.moonswatch-snoopy }}
      moonswatch-snoopy2: ${{ steps.filter.outputs.moonswatch-snoopy2 }}
      rolex-deepsea: ${{ steps.filter.outputs.rolex-deepsea }}
      rolex-deepsea2: ${{ steps.filter.outputs.rolex-deepsea2 }}
      lollipop: ${{ steps.filter.outputs.lollipop }}
      breguet: ${{ steps.filter.outputs.breguet }}
      hublot-balloondog: ${{ steps.filter.outputs.hublot-balloondog }}
      lucea: ${{ steps.filter.outputs.lucea }}
      chanel-j12: ${{ steps.filter.outputs.chanel-j12 }}
      chanel-j12-2: ${{ steps.filter.outputs.chanel-j12-2 }}
      snoopy1-moonswatch: ${{ steps.filter.outputs.snoopy1-moonswatch }}
      snoopy2-earth: ${{ steps.filter.outputs.snoopy2-earth }}
      snoopy3-earth-subdial: ${{ steps.filter.outputs.snoopy3-earth-subdial }}
      rolex-datejust: ${{ steps.filter.outputs.rolex-datejust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            moonswatch-snoopy:
              - 'moonswatch-snoopy/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            moonswatch-snoopy2:
              - 'moonswatch-snoopy2/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            rolex-deepsea:
              - 'rolex-deepsea/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            rolex-deepsea2:
              - 'rolex-deepsea2/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            lollipop:
              - 'lollipop/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            breguet:
              - 'breguet/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            hublot-balloondog:
              - 'hublot-balloondog/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            lucea:
              - 'lucea/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            chanel-j12:
              - 'chanel-j12/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            chanel-j12-2:
              - 'chanel-j12-2/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            snoopy1-moonswatch:
              - 'snoopy1-moonswatch/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            snoopy2-earth:
              - 'snoopy2-earth/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            snoopy3-earth-subdial:
              - 'snoopy3-earth-subdial/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            rolex-datejust:
              - 'rolex-datejust/**'
              - '.github/workflows/build-and-preview.yml'
              - '.github/scripts/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'

  build-chanel-j12:
    needs: changes
    if: |
      always() && (
        (github.event_name == 'push' && needs.changes.outputs.chanel-j12 == 'true') ||
        (github.event_name == 'workflow_dispatch' && contains(fromJSON('["chanel-j12","all"]'), inputs.watchface))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :chanel-j12:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: chanel-j12-APK
          path: chanel-j12/build/outputs/apk/debug/*.apk

      # actions/upload-artifact links require being logged into GitHub to
      # download, even on a public repo, and don't reliably show up on the
      # mobile web UI at all. A release asset doesn't have either problem,
      # so this gives a plain link anyone can download from. Reuses one
      # rolling tag so the link never changes between builds.
      - name: Publish APK as a public download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chanel-j12-latest
          name: chanel-j12 (latest build)
          body: Auto-published by CI from ${{ github.sha }}. Not a versioned release -- just a stable, login-free download link for the debug APK.
          prerelease: true
          files: chanel-j12/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-chanel-j12-2:
