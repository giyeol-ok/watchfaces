      # Same login-free release-asset link as chanel-j12 -- see its job for why.
      - name: Publish APK as a public download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chanel-j12-2-latest
          name: chanel-j12-2 (latest build)
          body: Auto-published by CI from ${{ github.sha }}. Not a versioned release -- just a stable, login-free download link for the debug APK.
          prerelease: true
