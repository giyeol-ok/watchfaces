          disable-animations: true
          script: chmod +x snoopy1-moonswatch/preview.sh .github/scripts/install_and_activate.sh && bash snoopy1-moonswatch/preview.sh

      - name: Write preview summary
        if: always()
        run: |
          {
            echo "## snoopy1-moonswatch: moon-phase sweep (+0/5/10/15/20/25 days) and AOD preview"
            echo
            for f in previews/moon_*.png previews/aod_screen.png; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              echo "**${name}**"
